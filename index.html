<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dpAlLL - อาหารสำเร็จรูปและซอสพรีเมียม</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Navbar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center">
                    <h1 class="text-3xl font-bold text-orange-600 tracking-wider">dpAlLL</h1>
                </div>
                <div>
                    <a href="#" class="text-gray-600 hover:text-orange-600 px-3 py-2 rounded-md font-medium">หน้าแรก</a>
                    <a href="#products" class="text-gray-600 hover:text-orange-600 px-3 py-2 rounded-md font-medium">สินค้าของเรา</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="bg-orange-100 py-16 sm:py-24">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h2 class="text-4xl font-extrabold text-gray-900 sm:text-5xl">
                อร่อยง่ายๆ สไตล์ <span class="text-orange-600">dpAlLL</span>
            </h2>
            <p class="mt-4 text-xl text-gray-600">
                ซอสปรุงรสและอาหารสำเร็จรูปคุณภาพระดับพรีเมียม แค่เปิดฝาก็อร่อยได้ทันที
            </p>
        </div>
    </div>

    <!-- Product Section -->
    <div id="products" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <h3 class="text-2xl font-bold text-gray-900 mb-8 text-center border-b-2 border-orange-200 pb-4 inline-block">สินค้าแนะนำ</h3>
        
        <!-- กล่องที่โค้ดพยายามหา (product-container) อยู่ตรงนี้ครับ -->
        <div id="product-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 mt-6">
            <div class="text-center w-full col-span-full text-gray-500">กำลังโหลดรายการสินค้า...</div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-8 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p>&copy; 2026 dpAlLL. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript สำหรับจำลองข้อมูลและจัดการปุ่ม LINE -->
    <script>
        const LINE_ID = "@dpall_shop"; 

        const products = [
            {
                id: 1,
                name: "ซอสผัดกะเพราสูตรเข้มข้น",
                description: "ไม่ต้องปรุงเพิ่ม แค่ผัดกับเนื้อสัตว์ก็อร่อยเหมือนเชฟมาทำให้",
                price: 89,
                image: "https://images.unsplash.com/photo-1596649281358-154dd9d96c46?auto=format&fit=crop&w=400&q=80",
                lineMessage: "สนใจสั่งซื้อ ซอสผัดกะเพราสูตรเข้มข้น จำนวน 1 ขวด"
            },
            {
                id: 2,
                name: "น้ำจิ้มสุกี้โบราณ dpAlLL",
                description: "รสชาติกลมกล่อม หอมงาเตะจมูก ทานกับอะไรก็เข้ากัน",
                price: 99,
                image: "https://images.unsplash.com/photo-1604328471151-b52226907017?auto=format&fit=crop&w=400&q=80",
                lineMessage: "สนใจสั่งซื้อ น้ำจิ้มสุกี้โบราณ จำนวน 1 ขวด"
            },
            {
                id: 3,
                name: "ข้าวไก่กระเทียม (พร้อมทาน)",
                description: "อาหารสำเร็จรูปพรีเมียม อุ่นไมโครเวฟ 2 นาที พร้อมทานทันที",
                price: 55,
                image: "https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?auto=format&fit=crop&w=400&q=80",
                lineMessage: "สนใจสั่งซื้อ ข้าวไก่กระเทียม (พร้อมทาน) จำนวน 1 กล่อง"
            }
        ];

        function loadProducts() {
            const container = document.getElementById('product-container');
            container.innerHTML = ''; 

            products.forEach(product => {
                const lineUrl = `https://line.me/R/oaMessage/${LINE_ID}/?${encodeURIComponent(product.lineMessage)}`;
                const card = `
                    <div class="bg-white rounded-xl shadow-lg overflow-hidden transform transition duration-300 hover:scale-105">
                        <img class="h-48 w-full object-cover" src="${product.image}" alt="${product.name}">
                        <div class="p-6">
                            <h4 class="text-lg font-bold text-gray-900">${product.name}</h4>
                            <p class="mt-2 text-sm text-gray-600 h-10">${product.description}</p>
                            <div class="mt-4 flex items-center justify-between">
                                <span class="text-xl font-bold text-orange-600">฿${product.price}</span>
                            </div>
                            <a href="${lineUrl}" target="_blank" class="mt-6 w-full flex items-center justify-center px-4 py-2 border border-transparent rounded-md shadow-sm text-base font-medium text-white bg-[#00B900] hover:bg-[#009900] transition">
                                <svg class="w-5 h-5 mr-2 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M24 10.304c0-5.369-5.383-9.738-12-9.738-6.616 0-12 4.369-12 9.738 0 4.814 4.269 8.846 10.036 9.608.391.084.922.258 1.057.592.122.303.079.778.039 1.085l-.171 1.027c-.053.303-.242 1.186 1.039.647 1.281-.54 6.911-4.069 9.428-6.967 1.739-1.907 2.572-3.843 2.572-5.992zm-15.65 1.564c0 .285-.231.516-.516.516H5.215c-.285 0-.516-.231-.516-.516V7.472c0-.285.231-.516.516-.516.285 0 .516.231.516.516v3.88h2.087c.285 0 .516.231.516.516zM10.8 11.868c0 .285-.231.516-.516.516H9.197c-.285 0-.516-.231-.516-.516V7.472c0-.285.231-.516.516-.516.285 0 .516.231.516.516v4.396zm3.435-4.396c0 .285-.231.516-.516.516h-1.014v1.36h1.014c.285 0 .516.231.516.516 0 .285-.231.516-.516.516h-1.014v1.361h1.014c.285 0 .516.231.516.516 0 .285-.231.516-.516.516h-1.53c-.285 0-.516-.231-.516-.516V7.472c0-.285.231-.516.516-.516h1.53c.285 0 .516.231.516.516zm5.05 4.396c0 .285-.231.516-.516.516h-1.53c-.285 0-.516-.231-.516-.516V7.472c0-.285.231-.516.516-.516.285 0 .516.231.516.516v1.36h1.014c.285 0 .516.231.516.516 0 .285-.231.516-.516.516h-1.014v1.361h1.014c.285 0 .516.231.516.516z"/></svg>
                                สั่งซื้อผ่าน LINE
                            </a>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        window.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
